name: Release

# v로 시작하는 태그(v1.4.0 등)를 푸시하면 APK·웹 빌드 후 GitHub Release에 자동 등록
on:
  push:
    tags: ['v*']

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Install dependencies
        run: flutter pub get

      - name: Run tests
        run: flutter test

      - name: Build Android APK
        run: |
          flutter build apk --release
          cp build/app/outputs/flutter-apk/app-release.apk \
            hangyeol-hangul-${{ github.ref_name }}.apk

      - name: Build web
        run: |
          flutter build web --release
          cd build/web
          zip -r ../../hangyeol-hangul-web-${{ github.ref_name }}.zip .

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          name: 한결이의 한글 놀이터 ${{ github.ref_name }}
          generate_release_notes: true
          body: |
            ## 📱 설치 방법 (Android)
            1. 휴대폰/태블릿에서 아래 `hangyeol-hangul-${{ github.ref_name }}.apk` 다운로드
            2. 파일을 열어 설치 (처음이라면 "출처를 알 수 없는 앱 설치 허용" 필요)

            ## 🌐 웹 버전
            `hangyeol-hangul-web-${{ github.ref_name }}.zip`을 풀어 정적 호스팅(GitHub Pages 등)에 올리면 브라우저에서 바로 실행됩니다.
          files: |
            hangyeol-hangul-${{ github.ref_name }}.apk
            hangyeol-hangul-web-${{ github.ref_name }}.zip
