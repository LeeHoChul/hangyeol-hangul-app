name: Release

# 두 가지 방법으로 릴리스:
#  1) v로 시작하는 태그(v1.4.0 등) 푸시
#  2) Actions 탭에서 수동 실행(workflow_dispatch) — pubspec.yaml의 version으로 태그를 만들어 릴리스
on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Determine release tag
        id: tag
        run: |
          if [[ "${GITHUB_REF_TYPE}" == "tag" ]]; then
            echo "tag=${GITHUB_REF_NAME}" >> "$GITHUB_OUTPUT"
          else
            VERSION=$(grep '^version:' pubspec.yaml | awk '{print $2}' | cut -d'+' -f1)
            echo "tag=v${VERSION}" >> "$GITHUB_OUTPUT"
          fi

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Install dependencies
        run: flutter pub get

      - name: Run tests
        run: flutter test

      - name: Build Android APK
        run: |
          flutter build apk --release
          cp build/app/outputs/flutter-apk/app-release.apk \
            hangyeol-hangul-${{ steps.tag.outputs.tag }}.apk

      - name: Build web
        run: |
          flutter build web --release
          cd build/web
          zip -r ../../hangyeol-hangul-web-${{ steps.tag.outputs.tag }}.zip .

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.tag.outputs.tag }}
          target_commitish: ${{ github.sha }}
          name: 한결이의 한글 놀이터 ${{ steps.tag.outputs.tag }}
          generate_release_notes: true
          body: |
            ## 📱 설치 방법 (Android)
            1. 휴대폰/태블릿에서 아래 `hangyeol-hangul-${{ steps.tag.outputs.tag }}.apk` 다운로드
            2. 파일을 열어 설치 (처음이라면 "출처를 알 수 없는 앱 설치 허용" 필요)

            ## 🌐 웹 버전
            `hangyeol-hangul-web-${{ steps.tag.outputs.tag }}.zip`을 풀어 정적 호스팅(GitHub Pages 등)에 올리면 브라우저에서 바로 실행됩니다.
          files: |
            hangyeol-hangul-${{ steps.tag.outputs.tag }}.apk
            hangyeol-hangul-web-${{ steps.tag.outputs.tag }}.zip
